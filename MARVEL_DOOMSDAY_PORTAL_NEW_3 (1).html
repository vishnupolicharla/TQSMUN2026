<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Doomsday: Secret Wars - Committee Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap');
        .font-cinzel { font-family: 'Cinzel', serif; }
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Top Bar -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">⚡</span>
            <div>
                <h1 class="font-cinzel font-bold text-xl tracking-wider text-red-500">MARVEL DOOMSDAY: SECRET WARS</h1>
                <p class="text-xs text-gray-400">Crisis Committee Portal & Resource Manager</p>
            </div>
        </div>
        <div id="connection-status" class="px-3 py-1 rounded-full text-xs font-medium bg-yellow-900/50 text-yellow-300 border border-yellow-700/50">
            Connecting to Supabase...
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <!-- Auth Screen -->
        <div id="auth-container" class="max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-xl p-8 shadow-2xl">
            <h2 class="font-cinzel text-2xl font-bold text-center mb-6 text-red-400">PORTAL ACCESS</h2>
            
            <div class="space-y-6">
                <!-- Delegate Login -->
                <div class="border border-gray-800 p-4 rounded-lg bg-gray-950">
                    <h3 class="font-semibold text-gray-200 mb-3 text-sm tracking-wide uppercase">Delegate Sign In</h3>
                    <form id="delegate-login-form" class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Delegate Email</label>
                            <input type="email" id="del-email" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500" placeholder="delegate@secretwars.com">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Access PIN (First 4 digits of phone)</label>
                            <input type="password" id="del-pin" maxlength="4" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500" placeholder="••••">
                        </div>
                        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded text-sm transition">Sign In as Delegate</button>
                    </form>
                </div>

                <!-- EB Login -->
                <div class="border border-gray-800 p-4 rounded-lg bg-gray-950">
                    <h3 class="font-semibold text-gray-200 mb-3 text-sm tracking-wide uppercase">Executive Board Sign In</h3>
                    <form id="eb-login-form" class="space-y-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">EB Email</label>
                            <input type="email" id="eb-email" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500" placeholder="eb@secretwars.com">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Password</label>
                            <input type="password" id="eb-password" required class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-medium py-2 rounded text-sm transition">Sign In as Executive Board</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Dashboard Screen (Hidden initially) -->
        <div id="dashboard-container" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-gray-900 border border-gray-800 p-4 rounded-xl">
                <div>
                    <h2 id="user-welcome" class="font-cinzel text-xl font-bold text-white">Welcome</h2>
                    <p id="user-role-badge" class="text-xs text-red-400 uppercase tracking-wider font-semibold"></p>
                </div>
                <div class="flex space-x-3">
                    <button id="factory-reset-btn" class="hidden bg-red-900/60 hover:bg-red-900 text-red-200 border border-red-700 px-4 py-2 rounded text-xs font-bold uppercase transition">Factory Reset</button>
                    <button id="logout-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded text-xs font-semibold uppercase transition">Sign Out</button>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="flex border-b border-gray-800 space-x-6">
                <button onclick="switchTab('resources')" id="tab-btn-resources" class="pb-3 border-b-2 border-red-500 font-semibold text-sm text-white">Resources & Publications</button>
            </div>

            <!-- Tab Content: Resources -->
            <div id="tab-content-resources" class="space-y-6">
                <!-- EB Add Resource Form (Visible only for EB) -->
                <div id="eb-resource-creator" class="hidden bg-gray-900 border border-gray-800 p-6 rounded-xl space-y-4">
                    <h3 class="font-cinzel font-bold text-lg text-red-400">Publish New Resource</h3>
                    <form id="add-resource-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Resource Title</label>
                            <input type="text" id="res-title" required class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Resource URL (Google Doc / Link)</label>
                            <input type="url" id="res-url" required class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-2 text-sm text-white" placeholder="https://docs.google.com/...">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Requirement Level</label>
                            <select id="res-requirement" class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-2 text-sm text-white">
                                <option value="mandatory">Mandatory</option>
                                <option value="optional" selected>Optional</option>
                                <option value="not_required">Not Required</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs text-gray-400 mb-1">Description</label>
                            <textarea id="res-desc" rows="2" class="w-full bg-gray-950 border border-gray-700 rounded px-3 py-2 text-sm text-white"></textarea>
                        </div>
                        <div class="md:col-span-2 flex justify-end">
                            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-2 rounded text-sm transition">Publish Resource</button>
                        </div>
                    </form>
                </div>

                <!-- Resource List -->
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
                    <h3 class="font-cinzel font-bold text-lg text-white">Committee Resources & Documents</h3>
                    <div id="resources-list-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://zznkmbenelyldkfbrjru.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TgP9-h6tpxrreb3hg-NzZQ_GNLbLAC6";

        let supabaseClient = null;
        let currentUser = null;

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
                document.getElementById("connection-status").textContent = "Supabase Connected";
                document.getElementById("connection-status").className = "px-3 py-1 rounded-full text-xs font-medium bg-green-900/50 text-green-300 border border-green-700/50";
            } catch (err) {
                document.getElementById("connection-status").textContent = "Connection Failed";
                document.getElementById("connection-status").className = "px-3 py-1 rounded-full text-xs font-medium bg-red-900/50 text-red-300 border border-red-700/50";
            }

            // Delegate Login Handler
            document.getElementById("delegate-login-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = document.getElementById("del-email").value.trim();
                const pin = document.getElementById("del-pin").value.trim();

                const { data, error } = await supabaseClient
                    .from("portal_delegate_profiles")
                    .select("*")
                    .eq("email", email)
                    .single();

                if (error || !data) {
                    alert("Delegate not found. Please check your email.");
                    return;
                }

                // Verify first 4 digits of phone
                const phoneStr = String(data.phone || "");
                if (!phoneStr.startsWith(pin)) {
                    alert("Invalid PIN (must match first 4 digits of your phone number).");
                    return;
                }

                currentUser = { ...data, role: 'delegate' };
                initDashboard();
            });

            // EB Login Handler
            document.getElementById("eb-login-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = document.getElementById("eb-email").value.trim();
                const password = document.getElementById("eb-password").value.trim();

                if (password !== "DOOMS123") {
                    alert("Invalid password.");
                    return;
                }

                const { data, error } = await supabaseClient
                    .from("portal_eb_users")
                    .select("*")
                    .eq("email", email)
                    .single();

                if (error || !data) {
                    alert("EB email not recognized.");
                    return;
                }

                currentUser = { ...data, role: 'eb' };
                initDashboard();
            });

            // Logout
            document.getElementById("logout-btn").addEventListener("click", () => {
                currentUser = null;
                document.getElementById("dashboard-container").classList.add("hidden");
                document.getElementById("auth-container").classList.remove("hidden");
            });

            // Add Resource Handler
            const addResForm = document.getElementById("add-resource-form");
            if (addResForm) {
                addResForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const title = document.getElementById("res-title").value;
                    const url = document.getElementById("res-url").value;
                    const requirement = document.getElementById("res-requirement").value;
                    const description = document.getElementById("res-desc").value;

                    const { error } = await supabaseClient.from("portal_resources").insert([{
                        title, url, requirement, description, eb_id: currentUser.id
                    }]);

                    if (error) {
                        alert("Error publishing resource: " + error.message);
                    } else {
                        addResForm.reset();
                        loadResources();
                    }
                });
            }

            // Factory Reset Handler
            document.getElementById("factory-reset-btn").addEventListener("click", async () => {
                if (confirm("WARNING: This will clear all dynamic committee data. Proceed?")) {
                    const { error } = await supabaseClient.rpc("portal_factory_reset");
                    if (error) {
                        alert("Reset failed: " + error.message);
                    } else {
                        alert("Factory reset completed successfully.");
                        loadResources();
                    }
                }
            });
        });

        async function initDashboard() {
            document.getElementById("auth-container").classList.add("hidden");
            document.getElementById("dashboard-container").classList.remove("hidden");

            document.getElementById("user-welcome").textContent = `Welcome, ${currentUser.name || currentUser.email}`;
            document.getElementById("user-role-badge").textContent = currentUser.role === 'eb' ? 'Executive Board' : 'Delegate';

            if (currentUser.role === 'eb') {
                document.getElementById("eb-resource-creator").classList.remove("hidden");
                if (currentUser.name === "Watcher 4" || currentUser.is_super_admin) {
                    document.getElementById("factory-reset-btn").classList.remove("hidden");
                }
            }

            loadResources();
        }

        async function loadResources() {
            const container = document.getElementById("resources-list-container");
            container.innerHTML = "<p class='text-gray-400 text-sm col-span-2'>Loading resources...</p>";

            const { data: resources, error } = await supabaseClient
                .from("portal_resources")
                .select("*")
                .order("created_at", { ascending: false });

            if (error || !resources || resources.length === 0) {
                container.innerHTML = "<p class='text-gray-500 text-sm col-span-2'>No publications or resources available yet.</p>";
                return;
            }

            container.innerHTML = "";
            resources.forEach(res => {
                const badgeColor = res.requirement === 'mandatory' ? 'bg-red-900/50 text-red-300 border-red-700' :
                                   res.requirement === 'optional' ? 'bg-blue-900/50 text-blue-300 border-blue-700' : 'bg-gray-800 text-gray-400 border-gray-700';
                
                const card = document.createElement("div");
                card.className = "bg-gray-950 border border-gray-800 rounded-lg p-4 flex flex-col justify-between space-y-3";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-semibold text-white text-base">${escapeHtml(res.title)}</h4>
                            <span class="text-xs px-2 py-0.5 rounded border uppercase font-medium ${badgeColor}">${res.requirement}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-3">${escapeHtml(res.description || '')}</p>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-900">
                        <a href="${escapeHtml(res.url)}" target="_blank" onclick="trackAccess('${res.id}')" class="text-xs text-red-400 hover:text-red-300 font-semibold flex items-center space-x-1">
                            <span>Open Resource ↗</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function trackAccess(resourceId) {
            if (currentUser && currentUser.role === 'delegate') {
                await supabaseClient.from("portal_resource_usage").upsert({
                    resource_id: resourceId,
                    delegate_id: currentUser.id,
                    accessed_at: new Date()
                }, { onConflict: 'resource_id,delegate_id' });
            }
        }

        function escapeHtml(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }

        function switchTab(tabName) {
            // Placeholder for tab switching if more tabs are added
        }
    </script>
</body>
</html>
